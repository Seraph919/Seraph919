name: README build

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout private updater code
        uses: actions/checkout@v4
        with:
          repository: Seraph919/profile-updater
          token: ${{ secrets.ACCESS_TOKEN }}
          path: .updater

      - name: Install dependencies
        run: python -m pip install -r .updater/requirements.txt

      - name: Update profile SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
          TARGET_DIR: '.'
        run: python .updater/today.py

      - name: Remove updater code
        run: rm -rf .updater

      - name: Deploy SVGs to assets branch
        run: |-
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git checkout --orphan assets
          git rm -rf --cached .
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: update profile SVGs [skip ci]"
          git push -f origin assets
